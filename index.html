<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reps Control Room</title><style>*{box-sizing:border-box}body{margin:0;background:#121b17;color:#f3f6f1;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);padding:36px;border:1px solid #35463b;border-radius:22px;background:#1d2922}small{color:#aed9bd;letter-spacing:.15em;font-weight:700}h1{font-size:32px;letter-spacing:-1px;margin:18px 0 12px}p{color:#aebeb3;line-height:1.6}label{display:block;margin:28px 0 9px}input{width:100%;padding:15px;border:1px solid #566b5b;border-radius:10px;background:#111b16;color:white;font:inherit}button{cursor:pointer;padding:14px 20px;border:0;border-radius:10px;background:#bae1c5;color:#14251b;font:600 16px inherit}form button{width:100%;margin-top:16px}button:disabled{opacity:.5}#error{min-height:24px;color:#ffbfac;font-size:14px}footer{font-size:12px;color:#81998a;margin-top:26px}#bar{display:none;position:fixed;right:18px;bottom:18px;z-index:20}iframe{display:none;width:100%;height:100dvh;border:0;background:#121b17}</style></head><body><main id="gate"><section class="card"><small>REPS · CONTROL ROOM</small><h1>Your workspace.<br>One place.</h1><p>Enter your shared password to open the dashboard.</p><form id="login"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit">Unlock dashboard →</button><p id="error" role="alert" aria-live="polite"></p></form><footer>© 2026 Harshavardhan Parthiban</footer></section></main><iframe id="workspace" title="Reps dashboard"></iframe><button id="bar">Lock dashboard</button><script>
(()=>{const base='https://reps-control-room.harshapartiban25.chatgpt.site';let token='',expires=0,timer;const $=id=>document.getElementById(id);function lock(message=''){token='';expires=0;clearTimeout(timer);$('workspace').srcdoc='';$('workspace').style.display='none';$('gate').style.display='grid';$('bar').style.display='none';$('error').textContent=message;$('password').value='';$('password').focus()}window.repsAPI=async(path,body)=>{if(!token||Date.now()>=expires){lock('Your session expired. Please unlock again.');throw Error('Session expired')}if(!/^\/api\//.test(path))throw Error('Invalid request');const response=await fetch(base+path,{method:body===undefined?'GET':'POST',credentials:'omit',cache:'no-store',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let data=await response.json();if(response.status===401)lock('Your session expired. Please unlock again.');if(!response.ok)throw Error(data.error||'Request failed');return data};$('login').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('error').textContent='Checking…';try{const response=await fetch(base+'/api/login',{method:'POST',credentials:'omit',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Could not sign in');token=data.token;expires=data.expiresAt;$('password').value='';const dashboard=await window.repsAPI('/api/dashboard');$('workspace').srcdoc=dashboard.html;$('gate').style.display='none';$('workspace').style.display='block';$('bar').style.display='block';$('error').textContent='';timer=setTimeout(()=>lock('Your session expired. Please unlock again.'),Math.max(0,expires-Date.now()))}catch(e){token='';$('error').textContent=e.message||'Could not connect. Try again.'}finally{$('submit').disabled=false}};$('bar').onclick=()=>{if(confirm('Lock the dashboard? Finish saving any changes first.'))lock()};})();
</script></body></html>
